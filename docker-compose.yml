services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/geofence.db
      SEED_DATA: "true"
      RATE_LIMIT_PER_MIN: "120"
    volumes:
      - geodata:/data
    healthcheck:
      test: ["CMD", "/app/server", "-health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  geodata:
